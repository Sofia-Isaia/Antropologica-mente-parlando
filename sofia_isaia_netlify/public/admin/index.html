<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Editor del blog · Sofia Isaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:var(--peach)}
  .shell{width:min(980px,100% - 40px);margin:0 auto;padding:40px 0 100px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:30px}
  .top h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);line-height:1;margin:0}
  .card{background:var(--field);border-radius:18px;padding:26px;margin-bottom:22px}
  .card h2{font-family:var(--serif);font-size:30px;margin:0 0 14px}
  label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  textarea.field{min-height:320px;line-height:1.6}
  .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
  .plist{list-style:none;margin:0;padding:0}
  .plist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .plist .t{font-family:var(--serif);font-size:22px;line-height:1.15;display:block}
  .plist .btns{display:flex;gap:8px;flex-shrink:0}
  .plist .btn,.clist .btn{font-size:13px;padding:6px 14px}
  .hint{font-size:14px;margin:4px 0 0}
  .prev{max-height:140px;border-radius:8px;margin-top:10px}
  .login{max-width:420px;margin:12vh auto 0}
  .clist .mail{font-size:14px;margin-left:8px}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}.plist li{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main class="shell">

  <section id="loginView" class="login card" hidden>
    <h2>Editor del blog</h2>
    <form id="loginForm">
      <label for="l-user">Usuario</label><input class="field" id="l-user" autocomplete="username" required>
      <label for="l-pass">Contraseña</label><input class="field" id="l-pass" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn solid" type="submit">Entrar</button></div>
      <p class="status" id="l-status" role="status"></p>
    </form>
  </section>

  <div id="app" hidden>
    <div class="top">
      <h1>Editor del blog</h1>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="/#blog" target="_blank" rel="noopener">Ver la web</a><button class="btn" id="logout">Salir</button></div>
    </div>

    <section class="card">
      <h2 id="formTitle">Nueva entrada</h2>
      <form id="postForm">
        <label for="f-title">Título</label><input class="field" id="f-title" maxlength="200" required>
        <div class="grid2">
          <div><label for="f-date">Mes de publicación</label><input class="field" id="f-date" type="month" required></div>
          <div><label for="f-cat">Categoría</label><input class="field" id="f-cat" maxlength="60" placeholder="Reflexiones, Diario, Lecturas…"></div>
        </div>
        <label for="f-img">Imagen de portada (opcional)</label>
        <input id="f-img" type="file" accept="image/jpeg,image/png,image/webp">
        <p class="hint">Se reduce automáticamente antes de subirla.</p>
        <img class="prev" id="f-prev" alt="" hidden>
        <div><button type="button" class="btn" id="f-noimg" hidden style="margin-top:10px">Quitar imagen</button></div>
        <label for="f-body">Texto</label>
        <textarea class="field" id="f-body" required></textarea>
        <p class="hint">Cada salto de línea crea un párrafo nuevo. El primer párrafo se muestra más grande, como entradilla.</p>
        <div class="actions"><button type="button" class="btn" id="f-cancel" hidden>Cancelar edición</button><button class="btn solid" type="submit" id="f-save">Publicar entrada</button></div>
        <p class="status" id="f-status" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Entradas publicadas</h2>
      <ul class="plist" id="plist"></ul>
    </section>

    <section class="card">
      <h2>Comentarios</h2>
      <label for="c-post">Entrada</label><select class="field" id="c-post"></select>
      <ul class="clist" id="clist"></ul>
    </section>
  </div>
</main>
<script>
(function(){
"use strict";
var TOKEN=sessionStorage.getItem('blogToken')||'';
var POSTS=[], editing=null, img='';
var $=function(id){return document.getElementById(id);};
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtMonth(d){ var m=/^(\d{4})-(\d{2})/.exec(d||''); return m? MONTHS[+m[2]-1]+' '+m[1] : 'sin fecha'; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function sortPosts(a){ return a.slice().sort(function(x,y){ return (y.date||'').localeCompare(x.date||'') || (y.created||0)-(x.created||0); }); }
function slug(t){ return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||('entrada-'+Date.now()); }

function api(path,opts){ opts=opts||{}; opts.headers=Object.assign({},opts.headers||{},TOKEN?{'Authorization':'Bearer '+TOKEN}:{});
  return fetch(path,opts).then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
    if(r.status===401&&path!=='/api/login'){ logout(); throw {error:'Tu sesión ha caducado. Vuelve a entrar.'}; }
    if(!r.ok) throw j; return j; }); }); }

function showLogin(){ $('app').hidden=true; $('loginView').hidden=false; $('l-user').focus(); }
function logout(){ TOKEN=''; sessionStorage.removeItem('blogToken'); showLogin(); }
$('logout').addEventListener('click',logout);
$('loginForm').addEventListener('submit',function(e){ e.preventDefault(); $('l-status').textContent='Comprobando…';
  api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('l-user').value,pass:$('l-pass').value})})
   .then(function(d){ TOKEN=d.token; sessionStorage.setItem('blogToken',TOKEN); $('l-pass').value=''; $('l-status').textContent=''; start(); })
   .catch(function(err){ $('l-status').textContent=(err&&err.error)||'No se pudo entrar.'; }); });

function start(){ $('loginView').hidden=true; $('app').hidden=false; resetForm();
  api('/api/posts').then(function(d){ POSTS=sortPosts(d.posts||[]); renderList(); }).catch(function(err){ $('f-status').textContent=(err&&err.error)||'No se pudieron cargar las entradas.'; }); }

function renderList(){
  $('plist').innerHTML=POSTS.length? POSTS.map(function(p,i){ return '<li><span><span class="pill">'+esc(fmtMonth(p.date))+(p.cat?', '+esc(p.cat):'')+'</span><span class="t">'+esc(p.title)+'</span></span><span class="btns"><a class="btn" href="/#entrada-'+esc(p.id)+'" target="_blank" rel="noopener">Ver</a><button class="btn" data-edit="'+i+'">Editar</button><button class="btn" data-del="'+i+'">Borrar</button></span></li>'; }).join('')
    : '<li>Todavía no hay entradas. Escribe la primera arriba.</li>';
  var sel=$('c-post'), cur=sel.value;
  sel.innerHTML=POSTS.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.title)+'</option>'; }).join('');
  if(cur&&POSTS.some(function(p){return p.id===cur;})) sel.value=cur;
  loadComments(); }

$('plist').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-edit')) edit(+b.getAttribute('data-edit'));
  if(b.hasAttribute('data-del')){ var p=POSTS[+b.getAttribute('data-del')];
    if(confirm('¿Borrar «'+p.title+'»? Desaparecerá de la web.')) save(POSTS.filter(function(x){return x!==p;}),'Entrada borrada.'); } });

function resetForm(){ editing=null; img=''; $('postForm').reset(); $('formTitle').textContent='Nueva entrada'; $('f-save').textContent='Publicar entrada'; $('f-cancel').hidden=true; $('f-prev').hidden=true; $('f-noimg').hidden=true;
  var d=new Date(); $('f-date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function edit(i){ var p=POSTS[i]; editing=p; img=p.img||'';
  $('f-title').value=p.title; $('f-date').value=p.date||''; $('f-cat').value=p.cat||''; $('f-body').value=(p.body||[]).join('\n\n');
  $('f-prev').hidden=!img; if(img) $('f-prev').src=img; $('f-noimg').hidden=!img;
  $('formTitle').textContent='Editar entrada'; $('f-save').textContent='Guardar cambios'; $('f-cancel').hidden=false; $('f-status').textContent='';
  $('f-title').scrollIntoView({behavior:'smooth',block:'center'}); $('f-title').focus({preventScroll:true}); }
$('f-cancel').addEventListener('click',resetForm);
$('f-noimg').addEventListener('click',function(){ img=''; $('f-img').value=''; $('f-prev').hidden=true; $('f-noimg').hidden=true; });

$('f-img').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f) return; $('f-status').textContent='Subiendo imagen…'; $('f-save').disabled=true;
  var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){ var s=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
    c.toBlob(function(blob){ api('/api/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob})
      .then(function(d){ img=d.url; $('f-prev').src=img; $('f-prev').hidden=false; $('f-noimg').hidden=false; $('f-status').textContent='Imagen lista.'; })
      .catch(function(err){ $('f-status').textContent=(err&&err.error)||'No se pudo subir la imagen.'; })
      .then(function(){ $('f-save').disabled=false; }); },'image/jpeg',.8); };
  im.onerror=function(){ $('f-status').textContent='No se pudo leer esa imagen.'; $('f-save').disabled=false; };
  im.src=url; });

$('postForm').addEventListener('submit',function(e){ e.preventDefault();
  var body=$('f-body').value.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean), title=$('f-title').value.trim();
  if(!title||!body.length){ $('f-status').textContent='Añade un título y al menos un párrafo.'; return; }
  var p={title:title,date:$('f-date').value,cat:$('f-cat').value.trim(),img:img,body:body};
  var next;
  if(editing){ p.id=editing.id; p.created=editing.created; next=POSTS.map(function(x){ return x===editing?p:x; }); }
  else { var id=slug(title), n=2; while(POSTS.some(function(x){return x.id===id;})) id=slug(title)+'-'+(n++); p.id=id; p.created=Date.now(); next=[p].concat(POSTS); }
  save(next, editing?'Cambios guardados.':'Entrada publicada.'); });

function save(next,msg){ $('f-save').disabled=true; $('f-status').textContent='Guardando…';
  api('/api/posts',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({posts:next})})
   .then(function(d){ POSTS=sortPosts(d.posts||[]); renderList(); resetForm(); $('f-status').textContent=msg; })
   .catch(function(err){ $('f-status').textContent=(err&&err.error)||'No se pudo guardar.'; })
   .then(function(){ $('f-save').disabled=false; }); }

function loadComments(){ var id=$('c-post').value, ul=$('clist'); if(!id){ ul.innerHTML=''; return; } ul.innerHTML='<li>Cargando…</li>';
  api('/api/comments?post='+encodeURIComponent(id)).then(function(d){ var cs=d.comments||[];
    ul.innerHTML=cs.length? cs.map(function(c){ return '<li><span class="who">'+esc(c.name)+'</span><a class="mail" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a><span class="when">'+esc(new Date(c.at).toLocaleString('es-ES'))+'</span><p>'+esc(c.text)+'</p><button class="btn" data-cid="'+esc(c.id)+'" style="margin-top:8px">Borrar comentario</button></li>'; }).join('') : '<li>Esta entrada no tiene comentarios.</li>'; })
  .catch(function(err){ ul.innerHTML='<li>'+esc((err&&err.error)||'No se pudieron cargar los comentarios.')+'</li>'; }); }
$('c-post').addEventListener('change',loadComments);
$('clist').addEventListener('click',function(e){ var b=e.target.closest('button[data-cid]'); if(!b||!confirm('¿Borrar este comentario?')) return;
  api('/api/comments?post='+encodeURIComponent($('c-post').value)+'&id='+encodeURIComponent(b.getAttribute('data-cid')),{method:'DELETE'}).then(loadComments)
   .catch(function(err){ alert((err&&err.error)||'No se pudo borrar.'); }); });

if(TOKEN) start(); else showLogin();
})();
</script>
</body>
</html>
